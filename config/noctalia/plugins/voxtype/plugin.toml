id = "shadowburst/voxtype"
name = "Voxtype"
version = "1.0.0"
plugin_api = 30
author = "shadowburst"
license = "MIT"
icon = "microphone"
description = "Voxtype dictation status, controls, and recording OSD."
dependencies = ["voxtype", "voxtype-audio-bridge", "systemctl"]
tags = ["audio", "bar", "recording", "utility"]

[[service]]
id = "status"
entry = "widget.luau"

[[panel]]
id = "osd"
entry = "osd.luau"
# Attached, not floating. A floating panel inherits [shell.panel] transparency_mode
# ("soft" here), which renders it translucent - that is what made the OSD look
# see-through instead of like the native volume/brightness OSD. Attached panels use
# the attached styling (an opaque card) and anchor to the bar's inward edge, so the
# OSD can no longer sit on top of the bar. Reading `placement` requires dropping
# `persistent`, which the docs restrict to floating panels.
width = 190
height = 48
placement = "attached"
dismiss_on_outside_click = false
keyboard_focus = "none"
