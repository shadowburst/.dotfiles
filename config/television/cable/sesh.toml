[metadata]
name = "sesh"
description = "Browse tmux sessions, configured projects, and zoxide directories"
requirements = ["sesh", "tmux"]

[source]
command = [
  { name = "All", run = "sesh list" },
  { name = "Tmux", run = "sesh list -t" },
  { name = "Configs", run = "sesh list -c" },
  { name = "Zoxide", run = "sesh list -z" },
]
frecency = false
no_sort = true

# Quote apostrophes explicitly: Television 0.15.9's action auto-quoting does not handle them safely.
[preview]
command = "sesh preview '{replace:s/'/'\"'\"'/g}'"

[keybindings]
enter = "actions:connect"
ctrl-s = "cycle_sources"
ctrl-d = ["actions:kill_session", "reload_source"]

[actions.connect]
description = "Connect to selected session"
command = "sesh connect '{replace:s/'/'\"'\"'/g}'"
mode = "execute"

[actions.kill_session]
description = "Kill selected tmux session without confirmation"
command = "tmux kill-session -t '={replace:s/'/'\"'\"'/g}'"
mode = "fork"
