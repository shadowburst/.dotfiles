[metadata]
name = "tuios"
description = "Browse persistent TUIOS sessions and zoxide projects"
requirements = ["tuios-session", "tuios", "zoxide"]

[source]
command = [
  { name = "All", run = "tuios-session list all" },
  { name = "Sessions", run = "tuios-session list sessions" },
  { name = "Zoxide", run = "tuios-session list dirs" },
]
display = "{split:\\t:0|replace:s/^session$//|replace:s/^directory$//} {split:\\t:2}"
frecency = false
no_sort = true

# Explicit shell quoting bypasses Television 0.15.9's unsafe apostrophe auto-quoting.
[preview]
command = "tuios-session preview '{replace:s/'/'\"'\"'/g}'"

[keybindings]
enter = "actions:connect"
ctrl-s = "cycle_sources"
ctrl-d = ["actions:kill_session", "reload_source"]

[actions.connect]
description = "Resume or create a persistent project session"
command = "tuios-session connect '{replace:s/'/'\"'\"'/g}'"
mode = "execute"

[actions.kill_session]
description = "Kill the selected TUIOS session immediately (never a directory)"
command = "tuios-session kill '{replace:s/'/'\"'\"'/g}'"
mode = "fork"
